<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text Counter</title>
    <style>
      :root {
        color: #232b35;
        background: #fbfaf7;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background:
          linear-gradient(rgba(16, 95, 87, 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(16, 95, 87, 0.04) 1px, transparent 1px),
          #fbfaf7;
        background-size: 28px 28px;
      }

      main {
        width: min(920px, calc(100% - 32px));
        margin: 0 auto;
        padding: 48px 0;
      }

      a {
        color: #087a73;
        font-weight: 700;
        text-decoration: none;
      }

      header {
        border-bottom: 1px solid #e7dfd4;
        margin-bottom: 24px;
        padding-bottom: 24px;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: #087a73;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-weight: 800;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 34px;
        line-height: 1.15;
      }

      p {
        max-width: 720px;
        color: #4f4b47;
        font-size: 17px;
        line-height: 1.6;
      }

      textarea {
        display: block;
        width: 100%;
        min-height: 280px;
        border: 1px solid #ded8cf;
        border-radius: 8px;
        background: #fffdf9;
        color: #232b35;
        font: inherit;
        line-height: 1.55;
        padding: 18px;
        resize: vertical;
      }

      textarea:focus {
        border-color: #087a73;
        outline: 3px solid rgba(8, 122, 115, 0.14);
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
        margin: 18px 0 0;
      }

      .stat {
        border: 1px solid #ded8cf;
        border-radius: 8px;
        background: #fffdf9;
        padding: 16px;
      }

      .stat strong {
        display: block;
        color: #087a73;
        font-size: 28px;
        line-height: 1;
      }

      .stat span {
        display: block;
        margin-top: 8px;
        color: #5d6570;
        font-size: 14px;
        font-weight: 700;
      }

      @media (max-width: 720px) {
        main {
          padding: 28px 0;
        }

        .stats {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <a href="/">← Back to index</a>
        <p class="eyebrow">Browser-only test tool</p>
        <h1>Text Counter</h1>
        <p>
          Paste text and get basic writing statistics. Everything runs in the browser, with no
          backend API calls and no data sent to a server.
        </p>
      </header>

      <textarea id="text" placeholder="Paste or type text here..."></textarea>

      <section class="stats" aria-label="Text statistics">
        <div class="stat">
          <strong id="characters">0</strong>
          <span>Characters</span>
        </div>
        <div class="stat">
          <strong id="words">0</strong>
          <span>Words</span>
        </div>
        <div class="stat">
          <strong id="sentences">0</strong>
          <span>Sentences</span>
        </div>
        <div class="stat">
          <strong id="readingTime">0</strong>
          <span>Minutes read</span>
        </div>
      </section>
    </main>

    <script>
      const text = document.querySelector("#text");
      const characters = document.querySelector("#characters");
      const words = document.querySelector("#words");
      const sentences = document.querySelector("#sentences");
      const readingTime = document.querySelector("#readingTime");

      function updateStats() {
        const value = text.value.trim();
        const wordList = value.match(/\S+/g) || [];
        const sentenceList = value.match(/[^.!?]+[.!?]+/g) || (value ? [value] : []);

        characters.textContent = text.value.length;
        words.textContent = wordList.length;
        sentences.textContent = sentenceList.length;
        readingTime.textContent = Math.ceil(wordList.length / 220);
      }

      text.addEventListener("input", updateStats);
      updateStats();
    </script>
  </body>
</html>
